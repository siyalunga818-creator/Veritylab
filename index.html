<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VerityLab Test App</title>
    <style>
      body { font-family: system-ui, -apple-system, Roboto, "Segoe UI", Arial; padding: 2rem; }
      .container { max-width: 600px; margin: 0 auto; }
      h1 { font-size: 1.5rem; }
      input[type="text"] { padding: 0.5rem; font-size: 1rem; width: 100%; box-sizing: border-box; margin-bottom: 0.5rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; }
      #result { margin-top: 1rem; padding: 0.5rem; background:#f7f7f7; border-radius:4px; min-height:1.5rem }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello from VerityLab 🧪</h1>

      <label for="userInput">Enter text:</label>
      <input id="userInput" type="text" placeholder="Type something..." />
      <button id="testBtn">Test</button>

      <div id="result" aria-live="polite"></div>
    </div>

    <script src="/js/script.js"></script>
  </body>
</html>
