<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VerityLab Test App</title>
    <style>
      body { font-family: system-ui, -apple-system, Roboto, "Segoe UI", Arial; padding: 2rem; }
      .container { max-width: 600px; margin: 0 auto; }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.2rem; margin-top: 2rem; }
      input[type="text"] { padding: 0.5rem; font-size: 1rem; width: 100%; box-sizing: border-box; margin-bottom: 0.5rem; }
      button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
      button:hover { background-color: #e0e0e0; }
      #result { margin-top: 1rem; padding: 0.5rem; background:#f7f7f7; border-radius:4px; min-height:1.5rem }
      
      /* Memory Section Styles */
      .memory-section { margin-top: 2rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; }
      .memory-input-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      .memory-input-group input { flex: 1; }
      .memory-input-group button { flex-shrink: 0; }
      .memory-list { margin-top: 1rem; }
      .memory-item { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        padding: 0.75rem; 
        margin-bottom: 0.5rem; 
        background: white; 
        border: 1px solid #e0e0e0; 
        border-radius: 4px; 
      }
      .memory-item span { flex: 1; word-break: break-word; }
      .memory-item button { 
        background-color: #ff4444; 
        color: white; 
        padding: 0.25rem 0.75rem; 
        border: none; 
        border-radius: 3px; 
        cursor: pointer; 
        flex-shrink: 0; 
        margin-left: 0.5rem; 
      }
      .memory-item button:hover { background-color: #cc0000; }
      .memory-empty { color: #999; font-style: italic; padding: 1rem 0; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello from VerityLab 🧪</h1>

      <label for="userInput">Enter text:</label>
      <input id="userInput" type="text" placeholder="Type something..." />
      <button id="testBtn">Test</button>

      <div id="result" aria-live="polite"></div>

      <!-- Memory Section -->
      <div class="memory-section">
        <h2>Memory 💾</h2>
        <div class="memory-input-group">
          <input id="memoryInput" type="text" placeholder="Add a memory..." />
          <button id="addMemoryBtn">Add</button>
        </div>
        <div class="memory-list" id="memoryList">
          <div class="memory-empty">No memories yet.</div>
        </div>
      </div>
    </div>

    <script src="/js/script.js"></script>
  </body>
</html>
